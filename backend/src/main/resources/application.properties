de.flapdoodle.mongodb.embedded.version=6.0.8
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/moadong?retryWrites=false}
server.port=${PORT:8080}
server.address=0.0.0.0
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.summary.queue=applicant-id-queue
rabbitmq.summary.exchange=applicant-id-exchange
rabbitmq.summary.routingKey=applicant-id-routing-key

cloud.aws.credentials.access-key=dummy-access-key
cloud.aws.credentials.secret-key=dummy-secret-key
cloud.aws.s3.bucket=dummy-bucket
cloud.aws.s3.endpoint=http://localhost:9000
cloud.aws.s3.view-endpoint=http://localhost:9000
cloud.aws.s3.bannerbucket=dummy-banner-bucket
cloud.aws.s3.banner-view-endpoint=http://localhost:9000

jwt.secret-key=thisisadummysecretkeyforjwttokengeneration1234567890
jwt.access-token.expiration.min=60
jwt.access-token.expiration.hour=1
jwt.refresh-token.expiration.min=1440
jwt.refresh-token.expiration.hour=24

server.domain=${SERVER_DOMAIN:http://localhost:8080}
server.feed.max-count=10
server.image.max-size=10485760
server.file-url.max-length=200
server.file-url.expiration-time=10

dev.portal.kakao-javascript-key=dummy-kakao-js-key

app.dev-registration-secret=dummy-dev-secret
app.encryption.key=12345678901234567890123456789012
app.encryption.iv=1234567890123456
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

gemma.server.host=localhost
gemma.server.port=8000

google.calendar.client-id=dummy-google-client-id
google.calendar.client-secret=dummy-google-client-secret
google.calendar.redirect-uri=http://localhost:8080/oauth2/callback/google

notion.client-id=dummy-notion-client-id
notion.client-secret=dummy-notion-client-secret
notion.redirect-uri=http://localhost:8080/oauth2/callback/notion
notion.version=2022-06-28


